function moveDialog(x,y){
 const d=$('dialog'), pane=$('workspace-pane'), margin=8;
 const fit=(value,limit)=>Math.max(margin,Math.min(value,Math.max(margin,limit-margin)));
 d.style.left=fit(x,pane.clientWidth-d.offsetWidth)+'px';
 d.style.top=fit(y,pane.clientHeight-d.offsetHeight)+'px';
}
function wireDialogMovement(){
 const handle=$('dialog-handle'), d=$('dialog');
 let start=null;
 handle.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('[data-action="close"]'))return;
  if(e.target.closest('#move-dialog'))$('move-dialog').focus();
  start={pointer:e.pointerId,x:e.clientX,y:e.clientY,left:d.offsetLeft,top:d.offsetTop};
  handle.setPointerCapture(e.pointerId);
  handle.classList.add('dragging');
  e.preventDefault();
 });
 handle.addEventListener('pointermove',e=>{
  if(start?.pointer===e.pointerId)moveDialog(start.left+e.clientX-start.x,start.top+e.clientY-start.y);
 });
 const clear=()=>{start=null;handle.classList.remove('dragging');};
 handle.addEventListener('lostpointercapture',clear);
 handle.addEventListener('pointercancel',clear);
 d.addEventListener('close',clear);
 $('move-dialog').addEventListener('keydown',e=>{
  const delta={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]}[e.key];
  if(!delta)return;
  e.preventDefault();
  moveDialog(d.offsetLeft+delta[0],d.offsetTop+delta[1]);
 });
 d.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();}});
 window.addEventListener('resize',()=>{if(d.open)moveDialog(d.offsetLeft,d.offsetTop);});
}

  (support.docTopic==='TR CASH 이용안내'?`<div class="stack"><h3>적립 방법</h3><div class="doc-steps">${steps.map((step,i)=>panel('STEP '+(i+1),step)).join('')}</div>${panel('조회 경로','영수증, 앱 메인 화면 및 앱의 내 정보에서 확인하는 화면 예시입니다.')}${panel('유의사항','상담 안내 시 실제 적용 기준과 유효기간을 확인해 주세요.')}</div>`:panel(support.docTopic,'<p>'+clean(guides[support.docTopic])+'</p>'));
 }
 return '<h2 class="aux-title">문서정보</h2><div class="aux-box"><div class="row ref-pills">'+topics.map(topic=>btn(topic,'doc:'+topic,support.doc===topic)).join('')+'</div><hr>'+body+'</div>';
}
function forms(action){
 const t=state.ticket,c=customer(),o=state.order;
 switch(action){
 case 'address':
  if(o.status==='배송 완료'){modal('상세 주소 변경','<p class="notice">배송 완료된 주문입니다. 주문 당시 배송지를 확인할 수 있습니다.</p>'+kv([['기존 배송지','서울 마포구 성산동 **'],['요청사항','부재 시 문 앞']]));break;}
  formDialog('상세 주소 변경 · '+o.id,kv([['현재 상세 주소',clean(o.address||'성산동 **')]])+'<label class="field">변경 상세 주소<input name="address" required autocomplete="off"></label>','address','변경 내용 확인');break;
 case 'sms':
  if(c.phone==='미확인'){modal('문자 발송','<p class="notice">확인된 연락처가 연결된 고객의 티켓에서 발송할 수 있습니다.</p>');break;}
  formDialog('문자 발송',kv([['수신 연락처',c.phone]])+'<label class="field">메시지<textarea name="body" required rows="3">문의하신 주문의 처리 상태를 확인해 안내드립니다.</textarea></label>','sms','가상 발송');break;
 case 'comp':
  if(t.owner==='guest'){modal('고객보상','<p class="notice">고객 식별 후 보상 대상을 확인합니다.</p>',btn('고객 정보 확인','customer',true));break;}
  formDialog('고객보상 접수',kv([['대상',c.name],['연결 주문',o?.id||'미연결']])+'<label class="field">보상 유형<select name="type"><option>사과 쿠폰</option><option>배송 지연 보상 e머니</option><option>이마티콘</option></select></label><label class="field">예시 금액<select name="amount"><option value="3000">3,000원</option><option value="5000">5,000원</option></select></label><label class="field">보상 사유<input name="reason" required></label><p class="quiet">보상 접수는 주문 환불과 별도로 기록합니다.</p>','comp','가상 보상 접수');break;
 case 'inquiry':
  modal('1:1 문의 내역',t.owner==='member'?kv([['2026.11.09','쿠폰 적용 · 답변 완료'],['2026.11.03','배송지 변경 · 답변 완료']]):'<p>연결된 1:1 문의가 없습니다.</p>',btn('문의 등록','inquiry-form',true));break;
 case 'inquiry-form':
  formDialog('1:1 문의 등록',kv([['연결 티켓','#'+t.id],['연결 주문',o?.id||'미선택']])+'<label class="field">제목<input name="title" required></label><label class="field">문의 내용<textarea name="body" rows="3" required></textarea></label>','inquiry','가상 등록');break;
 case 'note':
  formDialog('상담 메모','<label class="field">티켓 #'+t.id+'<textarea name="note" rows="4">'+clean(state.notes[t.id]||'')+'</textarea></label>','note','저장');break;
 case 'transfer':
  formDialog('상담 이관','<label class="field">이관 대상<select name="team"><option>주문·배송팀</option><option>반품·환불팀</option><option>회원지원팀</option></select></label><label class="field">이관 사유<input name="reason" required></label>','transfer','이관 확정');break;
 case 'end':
  if(t.state==='종료'){modal('상담 종료','<p>이미 종료된 티켓입니다.</p>');break;}
  modal('상담 종료','<p>티켓 #'+t.id+' 상담을 종료할까요?</p>',btn('계속 상담','close')+btn('종료 확정','form:end',true));break;
 case 'attach':
  formDialog('파일 첨부','<label class="field">채팅에 첨부할 파일<input type="file" name="file" required></label><p class="quiet">목업에서는 첨부 파일 이름을 채팅에 표시합니다.</p>','attach','가상 첨부');break;
 }
}
function submitForm(action){
 const form=$('detail-form'),t=state.ticket,o=state.order;
 if(form&&!form.reportValidity())return;
 const fields=form?new FormData(form):null;
 switch(action){
 case 'address':{
  const next=fields.get('address').trim();
  if(!next){toast('변경할 상세 주소를 입력해 주세요.');return;}
  modal('배송지 변경 확인',kv([['주문번호',o.id],['변경할 상세 주소',clean(next)]]),btn('이전','address')+btn('변경 확정','address-apply',true),false,'address-review');
  state.pending={address:next,order:o.id};return;
 }
 case 'comp':{
  const entry={id:'CS-'+(1001+state.comp.length),owner:t.owner,type:fields.get('type'),amount:Number(fields.get('amount'))};
  state.comp.unshift(entry);info('comp-log');return;
 }
 case 'sms':close();toast('문자 가상 발송 완료');return;
 case 'inquiry':close();toast('1:1 문의 가상 등록 완료');return;
 case 'note':state.notes[t.id]=fields.get('note');close();toast('상담 메모 저장 완료');return;
 case 'transfer':t.state='이관 요청';close();render();toast(fields.get('team')+'으로 가상 이관 요청');return;
 case 'end':t.state='종료';state.filter='closed';close();render();toast('상담 종료');return;
 case 'attach':if(t.state==='종료'){close();toast('종료된 상담입니다.');return;} t.messages.push(['상담사','첨부: '+fields.get('file').name,time()]);renderChat();close();return;
 }
}
function searchCatalog(){
 const q=$('catalog-form').elements.query.value.trim().toLowerCase();
 const bySku=new Map(orders.flatMap(o=>o.items).map(i=>[i.sku,i]));
 const rows=[...bySku.values()].filter(i=>i.name.toLowerCase().includes(q));
 $('catalog-results').innerHTML=rows.length?kv(rows.map(i=>[i.sku,i.name+' · '+won(i.price)])):'<p>일치하는 상품이 없습니다.</p>';
}
function action(key){
 const [name,arg]=key.split(':');
 const t=state.ticket,o=state.order;
 switch(name){
 case 'mode':close();state.mode=arg;render();$('work').scrollTop=0;break;
 case 'nav':navigate(arg);break;
 case 'ticket-preview':ticketQuery.selected=arg;managedPage();break;
 case 'ticket-page':ticketQuery.page=Number(arg);managedPage();break;
 case 'ticket-open':{
  const ticket=tickets.find(t=>t.id===arg);
  if(ticket){state.nav='내 티켓';state.filter=ticket.state==='종료'?'closed':'open';state.channel='전체';setTicket(ticket);}
  break;
 }
 case 'doc':support.doc=arg;managedPage();break;
 case 'doc-topic':support.docTopic=arg;managedPage();break;
 case 'compare':if(!inConsultation())navigate('내 티켓');showComparison();break;
 case 'filter':state.filter=arg;renderTickets();break;
 case 'ticket':setTicket(tickets.find(t=>t.id===arg));break;
 case 'tab':state.tab=arg;renderRight();$('work').scrollTop=0;break;
 case 'summary':{
  const section=$('summary-'+arg);
  if(section){
   state.summaryOpen.add(section.id);
   section.open=true;
   const work=$('work');
   work.scrollTop+=section.getBoundingClientRect().top-work.getBoundingClientRect().top;
  }
  break;
 }
 case 'history':showHistory(true);break;
 case 'order':setOrder(ownOrders().find(o=>o.id===arg));close();toast('주문을 선택했습니다.');break;
 case 'origin':setOrder(orders.find(o=>o.id===t.order));break;
 case 'item':{
  const before=state.modal;
  state.index=Number(arg);renderRight();
  if(before==='products')products();
  if(before==='claim-choice')claimForm();
  break;
 }
 case 'close':close();break;
 case 'customer':customerModal();break;
 case 'manual':modal('커머스 상담 가이드',kv([['결품 환불','결품 상품의 수량과 환불 금액을 확인합니다.'],['과거 주문 반품','기간 또는 상품명으로 주문을 찾고 반품 사유와 회수 방법을 선택합니다.'],['CS 보상','보상 유형과 사유를 확인한 뒤 별도로 접수합니다.']]));break;
 case 'catalog':
  modal('상품 검색',`<form id="catalog-form" class="row"><input name="query" aria-label="검색할 상품명" placeholder="예: 딸기"><button class="primary">검색</button></form><hr><div id="catalog-results"></div>`,btn('닫기','close'),false,'catalog');
  searchCatalog();break;
 case 'comp-option':
  forms('comp');
  if(state.ticket.owner!=='guest')$('detail-form').elements.type.selectedIndex=Number(arg);
  break;
 case 'online':state.online=!state.online;renderNav();toast(state.online?'온라인으로 변경했습니다.':'오프라인으로 변경했습니다.');break;
 case 'agent':modal('상담사 상태',kv([['상담사','김영기'],['현재 상태',state.online?'온라인':'오프라인'],['업무','온라인 커머스 상담']]),btn(state.online?'오프라인 전환':'온라인 전환','agent-toggle',true));break;
 case 'agent-toggle':close();action('online');break;
 case 'recent':{
  const record=recent.find(r=>r.id===arg&&r.owner===t.owner);
  if(!record)break;
  state.history=record;historyList();renderHistoryPane();
  document.querySelector('#history-pane [data-action="history-close"]')?.focus();
  break;
 }
 case 'history-more':
  state.historyExpanded=!state.historyExpanded;historyList();
  document.querySelector('[data-action="history-more"]')?.focus();
  break;
 case 'history-close':{
  const id=state.history?.id;
  state.history=null;historyList();renderHistoryPane();
  if(id)(document.querySelector(`[data-action="recent:${id}"]`)||document.querySelector('[data-action="history-more"]'))?.focus();
  break;
 }
 case 'receipt':receipt();break;
 case 'payment':receipt(true);break;
 case 'products':products();break;
 case 'cancel-order':orderCancel();break;
 case 'cancel-order-review':reviewOrderCancel();break;
 case 'cancel-order-submit':submitOrderCancel();break;
 case 'claim':claimForm(arg);break;
 case 'claim-review':claimReview(arg);break;
 case 'claim-submit':submitClaim();break;
 case 'claim-detail':claimDetail(arg);break;
 case 'claim-advance':{
  const c=related().find(entry=>entry.id===arg);
  const steps={'반품 접수 · 회수 대기':'회수 완료 · 검수 대기','회수 완료 · 검수 대기':'검수 완료 · 환불 대기','검수 완료 · 환불 대기':'환불 완료','환불 접수':'환불 완료','취소 접수':'취소 완료'};
  if(c&&steps[c.status]){c.status=steps[c.status];if(c.type==='전체 취소')o.status=c.status;renderRight();claimDetail(arg);}
  break;
 }
 case 'claim-message':{
  const result=claims.find(c=>c.id===arg);
  state.drafts[t.id]=(result.type==='전체 취소'?'주문 '+result.order+' 전체 '+result.status:result.name+' '+result.qty+'개 '+result.status)+'입니다. 접수번호는 '+result.id+'입니다.';
  close();renderChat();$('chat-input').focus();break;
 }
 case 'quick':support.quickOpen=true;quickQuery.query='';quickQuery.scope='전체';quickQuery.field='제목+내용';renderQuickChat();$('reply-search-chat').elements.query.focus();break;
 case 'quick-close':support.quickOpen=false;renderQuickChat();$('chat-input').focus();break;
 case 'reply-list':showQuickManager();break;
 case 'reply-detail':showQuickManager('detail',arg);break;
 case 'reply-edit':showQuickManager('edit',arg==='new'?null:arg);break;
 case 'reply-delete':showQuickManager('delete',arg);break;
 case 'reply-remove':{
  const index=replyRecords.findIndex(r=>r.id===Number(arg));
  if(index>=0){replyRecords.splice(index,1);showQuickManager();renderQuickChat();toast('빠른 답변을 삭제했습니다.');}
  break;
 }
 case 'quick-use':{
  const reply=replyById(arg);
  if(!reply||!inConsultation())break;
  if(t.state==='종료'){toast('종료된 티켓입니다.');break;}
  const draft=state.drafts[t.id];
  state.drafts[t.id]=draft?.trim()?draft+' '+reply.body:reply.body;
  if(state.modal==='reply-manager')close();
  renderChat();$('chat-input').focus();break;
 }
 case 'address-apply':if(state.pending?.order===o?.id){o.address=state.pending.address;state.pending=null;close();renderRight();toast('상세 주소가 변경되었습니다.');}break;
 case 'form':submitForm(arg);break;
 case 'tracking':case 'delivery-request':case 'store-event':case 'store-contact':case 'promo':case 'policy':case 'benefits':case 'cart':case 'claim-log':case 'comp-log':info(name);break;
 case 'address':case 'sms':case 'comp':case 'inquiry':case 'inquiry-form':case 'note':case 'transfer':case 'end':case 'attach':forms(name);break;
 }
}
document.addEventListener('click',event=>{
 const control=event.target.closest('button[data-action]');
 if(!control){
  const row=event.target.closest('tr[data-ticket-preview]');
  if(row)action('ticket-preview:'+row.dataset.ticketPreview);
  return;
 }
 if(control.disabled)return;
 const key=control.dataset.action;
 if(key.startsWith('item:')&&$('dialog').open&&!$('dialog').contains(control))close();
 action(key);
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='channel'){state.channel=el.value;renderTickets();$('channel').focus();}
 if(el.id==='topic'){state.ticket.topic=el.value;renderTickets();}
 if(el.form?.id==='order-search'&&['period','status'].includes(el.name))searchOrders();
 if(el.form?.id==='claim-form'&&el.name==='qty')$('refund-estimate').textContent=won(Number(el.value)*currentItem().price);
});
document.addEventListener('toggle',event=>{
 const section=event.target;
 if(!section.id?.startsWith('summary-')||!section.isConnected)return;
 if(section.open)state.summaryOpen.add(section.id);
 else state.summaryOpen.delete(section.id);
},true);
document.addEventListener('input',event=>{if(event.target.id==='chat-input')state.drafts[state.ticket.id]=event.target.value;});
document.addEventListener('submit',event=>{
 event.preventDefault();
 const form=event.target;
 if(form.id==='ticket-search-form'){
  Object.assign(ticketQuery,Object.fromEntries(new FormData(form)),{page:1});
  managedPage();
 }
 if(form.id.startsWith('reply-search-')){
  Object.assign(quickQuery,Object.fromEntries(new FormData(form)));
  if(form.id==='reply-search-chat')renderQuickChat();
  else showQuickManager();
 }
 if(form.id==='reply-form')saveReply(form);
 if(form.id==='inventory-form'){
  Object.assign(support.inventory,Object.fromEntries(new FormData(form)));
  managedPage();
 }
 if(event.target.id==='order-search')searchOrders();
 if(event.target.id==='catalog-form')searchCatalog();
 if(event.target.id==='chat-form'){
  const text=$('chat-input').value.trim();
  if(text&&state.ticket.state!=='종료'){state.ticket.messages.push(['상담사',text,time()]);state.drafts[state.ticket.id]='';renderChat();$('chat-input').focus();}
 }
});
wireDialogMovement();
render();
setTimeout(()=>{state.initialAlert=false;},2700);
</script></body></html>
